
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roberto Tajanlangit - Paper Countdown Timer</title>

    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            font-family: 'Patrick Hand', cursive;
            background:
                radial-gradient(ellipse at top left,
                    #e7d1a5, transparent 55%),
                linear-gradient(135deg, #b99b72, #e5d1ad, #a9855b);
        }

        .container {
            position: relative;
            width: min(100%, 440px);
            padding: 45px 28px 35px;
            text-align: center;
            color: #4b3523;
            background-color: #f8edcf;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 27px,
                    rgba(150, 112, 67, 0.10) 28px
                ),
                radial-gradient(
                    circle at 20% 30%,
                    rgba(255, 255, 255, 0.65),
                    transparent 65%
                );
            border: 1px solid #d3b98d;
            border-radius: 4px 4px 8px 4px;
            box-shadow:
                0 4px 6px rgba(62, 39, 18, 0.12),
                0 18px 35px rgba(48, 30, 12, 0.28),
                inset 0 0 25px rgba(165, 119, 55, 0.12);
            transform: rotate(-1deg);
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 9px;
            border: 1px dashed rgba(128, 86, 42, 0.38);
            pointer-events: none;
        }

        .name {
            position: relative;
            font-family: 'Caveat', cursive;
            font-size: 29px;
            font-weight: 700;
            color: #87562e;
            margin-bottom: 12px;
        }

        h1 {
            position: relative;
            font-family: 'Caveat', cursive;
            font-size: clamp(34px, 8vw, 43px);
            margin-bottom: 25px;
            color: #593b24;
        }

        #countdown {
            position: relative;
            font-size: clamp(25px, 7vw, 36px);
            font-weight: bold;
            margin: 25px 0 18px;
            padding: 20px 8px;
            background: rgba(255, 252, 237, 0.72);
            border: 1px solid #d7c19b;
            border-radius: 5px;
            box-shadow: inset 0 2px 6px rgba(95, 65, 34, 0.08);
        }

        #datetime {
            position: relative;
            margin: 15px 0 25px;
            font-size: 16px;
            color: #80664a;
        }

        .buttons {
            position: relative;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            padding: 11px 17px;
            border: 1px solid #76502f;
            border-radius: 4px;
            color: #fff7e8;
            font-family: 'Patrick Hand', cursive;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(70, 45, 20, 0.18);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #pauseBtn { background: #997448; }
        #playBtn { background: #5f7951; }
        #resetBtn { background: #a65d46; }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 10px rgba(70, 45, 20, 0.22);
        }

        button:active {
            transform: scale(0.96);
        }

        button:focus-visible {
            outline: 3px solid #5f452d;
            outline-offset: 3px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            position: relative;
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #785332;
        }

        .footer {
            position: relative;
            margin-top: 20px;
            font-family: 'Caveat', cursive;
            font-size: 20px;
            color: #967451;
        }

        @media (max-width: 380px) {
            .container {
                padding: 35px 17px 28px;
            }

            button {
                padding: 10px 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <p class="name">✦ Roberto Tajanlangit ✦</p>

        <h1>⏳ Countdown Timer</h1>

        <p id="countdown" aria-live="polite">
            Time remaining: 60 seconds
        </p>

        <p id="datetime"></p>

        <div class="buttons">
            <button id="pauseBtn" type="button">⏸ Pause</button>
            <button id="playBtn" type="button">▶ Play</button>
            <button id="resetBtn" type="button">↻ Reset</button>
        </div>

        <p id="status" role="status">READY</p>

        <p class="footer">~ Make every second count ~</p>
    </main>

    <script>
        const START_TIME = 60;

        let secondsLeft = START_TIME;
        let countdownInterval = null;
        let endTime = null;

        const countdownDisplay =
            document.getElementById("countdown");

        const datetimeDisplay =
            document.getElementById("datetime");

        const statusDisplay =
            document.getElementById("status");

        const pauseBtn = document.getElementById("pauseBtn");
        const playBtn = document.getElementById("playBtn");
        const resetBtn = document.getElementById("resetBtn");

        function showDateTime() {
            datetimeDisplay.textContent =
                new Date().toLocaleString();
        }

        function updateCountdown() {
            countdownDisplay.textContent =
                `Time remaining: ${secondsLeft} second${secondsLeft === 1 ? "" : "s"}`;
        }

        function updateButtons() {
            pauseBtn.disabled = countdownInterval === null;
            playBtn.disabled =
                countdownInterval !== null || secondsLeft <= 0;
        }

        function stopInterval() {
            if (countdownInterval !== null) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }

        function tick() {
            if (endTime === null) return;

            secondsLeft = Math.max(
                0,
                Math.ceil((endTime - Date.now()) / 1000)
            );

            if (secondsLeft <= 0) {
                stopInterval();
                endTime = null;

                countdownDisplay.textContent = "🎉 Time is up!";
                statusDisplay.textContent = "COMPLETED";

                updateButtons();
                return;
            }

            updateCountdown();
        }

        function startCountdown() {
            if (countdownInterval !== null || secondsLeft <= 0) {
                return;
            }

            endTime = Date.now() + secondsLeft * 1000;
            statusDisplay.textContent = "RUNNING";

            updateButtons();
            tick();

            if (secondsLeft > 0) {
                countdownInterval = setInterval(tick, 200);
                updateButtons();
            }
        }

        function pauseCountdown() {
            if (countdownInterval === null) return;

            tick();

            if (secondsLeft <= 0) return;

            stopInterval();
            endTime = null;

            statusDisplay.textContent = "PAUSED";
            updateButtons();
        }

        function playCountdown() {
            if (secondsLeft <= 0) {
                statusDisplay.textContent = "COMPLETED";
                return;
            }

            startCountdown();
        }

        function resetCountdown() {
            stopInterval();
            endTime = null;
            secondsLeft = START_TIME;

            updateCountdown();
            statusDisplay.textContent = "READY";
            updateButtons();
        }

        pauseBtn.addEventListener("click", pauseCountdown);
        playBtn.addEventListener("click", playCountdown);
        resetBtn.addEventListener("click", resetCountdown);

        showDateTime();
        setInterval(showDateTime, 1000);

        updateCountdown();
        updateButtons();
    </script>
</body>
</html>
